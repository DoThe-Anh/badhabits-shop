spring.application.name=badhabits-store
server.port=8080

# MySQL (XAMPP local) — port 3306, user root, password rỗng (default XAMPP)
# createDatabaseIfNotExist=true → tự tạo schema "badhabits" nếu chưa có
spring.datasource.url=jdbc:mysql://localhost:3306/shop?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&characterEncoding=utf8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# Flyway quản lý schema. Hibernate KHÔNG tự ALTER nữa.
# Đổi sang `validate` nếu muốn Hibernate kiểm tra entity ↔ schema khớp lúc startup
# (chặt hơn, có thể catch drift; nhưng cần V1 match exact với entity mapping).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Hibernate 6 auto-detect dialect từ JDBC URL — không cần khai báo

# Flyway migrations
# - Đọc từ classpath:db/migration/V*.sql (default location)
# - baseline-on-migrate=true → DB đã có sẵn schema (từ ddl-auto=update cũ)
#   sẽ được mark là baseline thay vì fail. Chỉ migration V2+ mới chạy.
# - Fresh DB → V1__init_schema.sql tạo toàn bộ schema từ đầu.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Thymeleaf — load từ classpath:/templates/ (Spring Boot default)
# spring-boot-devtools tự reload khi sửa file dưới src/main/resources/templates
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Static assets: classpath:/static/ (Spring Boot default), không cache khi dev
spring.web.resources.cache.period=0

# Locale
spring.web.locale=vi_VN
spring.mvc.format.date=dd/MM/yyyy

# Catch unmatched URL → ném NoHandlerFoundException → GlobalExceptionHandler render error/404.html
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# Upload — thư mục lưu ảnh sản phẩm (relative tới CWD = backend/ khi chạy ./mvnw)
app.upload.dir=../uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Admin bootstrap — đọc từ backend/.env (qua spring-dotenv)
# Để trống ADMIN_PASSWORD trong .env → DataInitializer KHÔNG seed admin (lần đầu sẽ không có ai login được)
app.admin.email=${ADMIN_EMAIL:admin@bh.vn}
app.admin.password=${ADMIN_PASSWORD:}
