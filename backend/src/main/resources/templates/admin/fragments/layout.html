<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="sidebar(active)" class="admin-sidebar">
    <a th:href="@{/admin}" class="admin-sidebar__brand">BAD HABITS · ADMIN</a>
    <ul class="admin-sidebar__nav">
        <li><a th:href="@{/admin}"
               th:classappend="${active == 'dashboard'} ? 'is-active'">Dashboard</a></li>
        <li><a th:href="@{/admin/orders}"
               th:classappend="${active == 'orders'} ? 'is-active'">Đơn hàng</a></li>
        <li><a th:href="@{/admin/products}"
               th:classappend="${active == 'products'} ? 'is-active'">Sản phẩm</a></li>
        <li><a th:href="@{/admin/categories}"
               th:classappend="${active == 'categories'} ? 'is-active'">Danh mục</a></li>
        <li><a th:href="@{/admin/users}"
               th:classappend="${active == 'users'} ? 'is-active'">Người dùng</a></li>
    </ul>
    <div class="admin-sidebar__footer">
        <span class="admin-sidebar__user"
              th:text="${currentUser != null ? currentUser.email() : ''}">admin@bh.vn</span>
        <form th:action="@{/admin/logout}" method="post">
            <button type="submit" class="admin-sidebar__logout">Đăng xuất admin</button>
        </form>
    </div>
</nav>

<div th:fragment="flash" class="admin-flash">
    <p th:if="${flashSuccess}" th:text="${flashSuccess}" class="admin-flash__success"></p>
    <p th:if="${flashError}" th:text="${flashError}" class="admin-flash__error"></p>
</div>

</body>
</html>
