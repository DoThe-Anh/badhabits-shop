<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Không tìm thấy trang — BAD HABITS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <style>
        .error-page {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem 1.5rem;
        }
        .error-page__inner {
            text-align: center;
            max-width: 540px;
        }
        .error-page__code {
            font-size: clamp(5rem, 18vw, 9rem);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            margin: 0;
        }
        .error-page__title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0.5rem 0 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .error-page__message {
            color: #555;
            margin: 0 0 2rem;
            line-height: 1.6;
        }
        .error-page__actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/announcement-bar :: announcement}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="error-page">
    <div class="error-page__inner">
        <h1 class="error-page__code">404</h1>
        <p class="error-page__title">Không tìm thấy trang</p>
        <p class="error-page__message"
           th:text="${message ?: 'Trang bạn yêu cầu không tồn tại hoặc đã bị xoá.'}">
            Trang bạn yêu cầu không tồn tại hoặc đã bị xoá.
        </p>
        <div class="error-page__actions">
            <a th:href="@{/}" class="btn btn--primary">VỀ TRANG CHỦ</a>
            <a th:href="@{/shop}" class="btn btn--secondary">XEM SẢN PHẨM</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/cart-drawer :: drawer}"></div>

<script th:src="@{/js/main.js}" defer></script>
</body>
</html>
