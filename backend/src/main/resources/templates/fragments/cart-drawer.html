<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="drawer" class="cart-drawer" data-cart-drawer aria-hidden="true">
    <div class="cart-drawer__backdrop" data-cart-drawer-close></div>
    <div class="cart-drawer__panel">
        <header class="cart-drawer__header">
            <h2>GIỎ HÀNG
                <span th:if="${cart != null}"
                      th:text="'(' + ${cart.itemCount} + ')'"
                      class="cart-drawer__count">(0)</span>
            </h2>
            <button type="button" class="cart-drawer__close" data-cart-drawer-close aria-label="Đóng">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M18 6L6 18M6 6l12 12"/>
                </svg>
            </button>
        </header>

        <div th:if="${cart == null or cart.empty}" class="cart-drawer__empty">
            <p>Giỏ hàng của bạn đang trống.</p>
            <a th:href="@{/shop}" class="btn btn--primary">TIẾP TỤC MUA SẮM</a>
        </div>

        <div th:unless="${cart == null or cart.empty}" class="cart-drawer__body">
            <div class="cart-drawer__progress" th:if="${cart.freeShippingRemaining > 0}">
                <p>Mua thêm <strong th:text="${cart.freeShippingRemainingFormatted}">100.000₫</strong> để được
                    <strong>FREE SHIP</strong></p>
                <div class="cart-drawer__progress-bar">
                    <div th:style="'width:' + ${cart.subtotal * 100 / 500000} + '%'"></div>
                </div>
            </div>

            <ul class="cart-drawer__items">
                <li th:each="item : ${cart.items}" class="cart-drawer-item">
                    <a th:href="@{'/product/' + ${item.productSlug}}" class="cart-drawer-item__image">
                        <img th:src="${item.image}" th:alt="${item.name}" loading="lazy"/>
                    </a>
                    <div class="cart-drawer-item__info">
                        <h4 class="cart-drawer-item__name">
                            <a th:href="@{'/product/' + ${item.productSlug}}"
                               th:text="${item.name}">Product name</a>
                        </h4>
                        <p class="cart-drawer-item__variant">
                            <span th:if="${item.size != null}" th:text="'Size: ' + ${item.size}"></span>
                            <span th:if="${item.color != null}" th:text="' · ' + ${item.color}"></span>
                        </p>
                        <p class="cart-drawer-item__price">
                            <span th:text="${item.quantity} + ' × '"></span>
                            <span th:text="${item.priceFormatted}">520.000₫</span>
                        </p>
                        <form th:action="@{/cart/remove}" method="post" class="cart-drawer-item__remove">
                            <input type="hidden" name="lineId" th:value="${item.lineId}"/>
                            <button type="submit">Xoá</button>
                        </form>
                    </div>
                </li>
            </ul>

            <footer class="cart-drawer__footer">
                <div class="cart-drawer__subtotal">
                    <span>Tạm tính</span>
                    <strong th:text="${cart.subtotalFormatted}">520.000₫</strong>
                </div>
                <a th:href="@{/cart}" class="btn btn--outline">XEM GIỎ HÀNG</a>
                <a th:href="@{/checkout}" class="btn btn--primary">THANH TOÁN</a>
            </footer>
        </div>
    </div>
</aside>
</body>
</html>
