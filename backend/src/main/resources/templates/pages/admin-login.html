<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin login — BAD HABITS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="page-auth admin">

<main>
    <div class="auth">
        <div class="auth__card">
            <h1 class="auth__title">ADMIN LOGIN</h1>
            <p class="auth__sub">Khu vực quản trị — tách biệt với login khách hàng.</p>

            <div th:if="${successMessage}" class="auth__alert auth__alert--success"
                 th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="auth__alert auth__alert--error"
                 th:text="${errorMessage}"></div>

            <form th:action="@{/admin/login}" method="post" class="auth__form">
                <label class="auth__field">
                    <span>Email admin</span>
                    <input type="email" name="email" required autofocus
                           placeholder="admin@bh.vn"/>
                </label>
                <label class="auth__field">
                    <span>Mật khẩu</span>
                    <input type="password" name="password" required minlength="6"
                           placeholder="••••••••"/>
                </label>

                <button type="submit" class="btn btn--primary btn--block">ĐĂNG NHẬP ADMIN</button>
            </form>

            <p class="auth__foot">
                Đăng nhập khách hàng? <a th:href="@{/login}">Về /login</a>
            </p>
        </div>
    </div>
</main>

</body>
</html>
