<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Giỏ hàng — BAD HABITS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/announcement-bar :: announcement}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-cart">

    <nav class="breadcrumb">
        <a th:href="@{/}">Trang chủ</a>
        <span>/</span>
        <span>Giỏ hàng</span>
    </nav>

    <header class="category-head">
        <h1>GIỎ HÀNG CỦA BẠN</h1>
    </header>

    <div th:if="${cart.empty}" class="cart-empty">
        <p>Giỏ hàng của bạn đang trống.</p>
        <a th:href="@{/shop}" class="btn btn--primary">TIẾP TỤC MUA SẮM</a>
    </div>

    <div th:unless="${cart.empty}" class="cart-layout">
        <div class="cart-layout__items">
            <div th:if="${cart.freeShippingRemaining > 0}" class="cart-shipping-hint">
                Mua thêm <strong th:text="${cart.freeShippingRemainingFormatted}">100.000₫</strong>
                để được <strong>FREE SHIP</strong>
            </div>

            <ul class="cart-list">
                <li th:each="item : ${cart.items}" class="cart-line">
                    <a th:href="@{'/product/' + ${item.productSlug}}" class="cart-line__image">
                        <img th:src="${item.image}" th:alt="${item.name}" loading="lazy"/>
                    </a>
                    <div class="cart-line__info">
                        <h3 class="cart-line__name">
                            <a th:href="@{'/product/' + ${item.productSlug}}"
                               th:text="${item.name}">Product</a>
                        </h3>
                        <p class="cart-line__variant">
                            <span th:if="${item.size != null}" th:text="'Size: ' + ${item.size}"></span>
                            <span th:if="${item.color != null}" th:text="' · ' + ${item.color}"></span>
                        </p>
                        <p class="cart-line__price" th:text="${item.priceFormatted}">520.000₫</p>

                        <form th:action="@{/cart/update}" method="post" class="cart-line__qty">
                            <input type="hidden" name="lineId" th:value="${item.lineId}"/>
                            <div class="qty-stepper">
                                <button type="submit" name="quantity" th:value="${item.quantity - 1}"
                                        aria-label="Giảm">−</button>
                                <input type="number" name="quantity" th:value="${item.quantity}"
                                       min="1" max="99" onchange="this.form.submit()"/>
                                <button type="submit" name="quantity" th:value="${item.quantity + 1}"
                                        aria-label="Tăng">+</button>
                            </div>
                        </form>
                    </div>
                    <div class="cart-line__actions">
                        <p class="cart-line__total" th:text="${item.lineTotalFormatted}">520.000₫</p>
                        <form th:action="@{/cart/remove}" method="post">
                            <input type="hidden" name="lineId" th:value="${item.lineId}"/>
                            <button type="submit" class="cart-line__remove">XOÁ</button>
                        </form>
                    </div>
                </li>
            </ul>
        </div>

        <aside class="cart-layout__summary">
            <h2>TÓM TẮT ĐƠN HÀNG</h2>
            <dl class="cart-summary">
                <div>
                    <dt>Tạm tính</dt>
                    <dd th:text="${cart.subtotalFormatted}">520.000₫</dd>
                </div>
                <div>
                    <dt>Phí vận chuyển</dt>
                    <dd th:text="${cart.shippingFeeFormatted}">30.000₫</dd>
                </div>
                <div class="cart-summary__total">
                    <dt>Tổng cộng</dt>
                    <dd th:text="${cart.totalFormatted}">550.000₫</dd>
                </div>
            </dl>
            <a th:href="@{/checkout}" class="btn btn--primary btn--block">TIẾN HÀNH THANH TOÁN</a>
            <a th:href="@{/shop}" class="cart-summary__continue">← Tiếp tục mua sắm</a>
        </aside>
    </div>

</main>

<div th:replace="~{fragments/newsletter :: newsletter}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/cart-drawer :: drawer}"></div>

<script th:src="@{/js/main.js}" defer></script>
</body>
</html>
