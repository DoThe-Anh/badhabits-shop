<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' — BAD HABITS'">Shop — BAD HABITS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/announcement-bar :: announcement}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-category">

    <nav class="breadcrumb">
        <a th:href="@{/}">Trang chủ</a>
        <span>/</span>
        <a th:href="@{/shop}">Shop</a>
        <span th:if="${category != null}">/</span>
        <span th:if="${category != null}" th:text="${category.name()}">Category</span>
    </nav>

    <header class="category-head">
        <h1 th:text="${title}">Tất cả sản phẩm</h1>
        <p th:if="${category != null}" th:text="${category.description()}"
           class="category-head__desc">Mô tả danh mục</p>
    </header>

    <div class="category-toolbar">
        <p class="category-toolbar__count">
            <span th:text="${#lists.size(products)}">0</span> sản phẩm
        </p>
        <form method="get" class="category-toolbar__sort">
            <label for="sort">Sắp xếp</label>
            <select id="sort" name="sort" onchange="this.form.submit()">
                <option value="featured" th:selected="${sort == null or sort == 'featured'}">Nổi bật</option>
                <option value="newest" th:selected="${sort == 'newest'}">Mới nhất</option>
                <option value="price-asc" th:selected="${sort == 'price-asc'}">Giá: Thấp → Cao</option>
                <option value="price-desc" th:selected="${sort == 'price-desc'}">Giá: Cao → Thấp</option>
            </select>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="category-empty">
        <p>Chưa có sản phẩm nào trong danh mục này.</p>
        <a th:href="@{/shop}" class="btn btn--outline">XEM TẤT CẢ SẢN PHẨM</a>
    </div>

    <div th:unless="${#lists.isEmpty(products)}" class="product-grid product-grid--4">
        <th:block th:each="product : ${products}">
            <div th:replace="~{fragments/product-card :: card(${product})}"></div>
        </th:block>
    </div>

</main>

<div th:replace="~{fragments/newsletter :: newsletter}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/cart-drawer :: drawer}"></div>

<script th:src="@{/js/main.js}" defer></script>
</body>
</html>
