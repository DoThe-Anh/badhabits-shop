<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đặt hàng thành công — BAD HABITS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>

<div th:replace="~{fragments/announcement-bar :: announcement}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main class="page-success">
    <div class="success">
        <div class="success__icon">✓</div>
        <h1>CẢM ƠN BẠN!</h1>
        <p class="success__lead">
            Đơn hàng <strong th:text="${order.orderId}">BH1001</strong> của bạn đã được tiếp nhận.
            Chúng tôi đã gửi xác nhận tới <strong th:text="${order.email}">email@example.com</strong>.
        </p>

        <div class="success__card">
            <dl>
                <div><dt>Mã đơn hàng</dt><dd th:text="${order.orderId}">BH1001</dd></div>
                <div><dt>Người nhận</dt><dd th:text="${order.fullName}">—</dd></div>
                <div><dt>Địa chỉ</dt><dd><span th:text="${order.address}"></span>, <span th:text="${order.city}"></span></dd></div>
                <div><dt>Điện thoại</dt><dd th:text="${order.phone}">—</dd></div>
                <div><dt>Thanh toán</dt>
                    <dd th:text="${order.paymentMethod == 'cod'} ? 'COD - Thu tiền khi giao hàng' :
                                 (${order.paymentMethod == 'bank'} ? 'Chuyển khoản ngân hàng' :
                                 (${order.paymentMethod == 'momo'} ? 'Ví MoMo' : 'VNPay'))">—</dd>
                </div>
                <div><dt>Trạng thái</dt><dd th:text="${order.statusLabel()}">Chờ xác nhận</dd></div>
            </dl>
        </div>

        <div class="success__card">
            <ul class="success__items">
                <li th:each="item : ${order.items}">
                    <span th:text="${item.name} + ' × ' + ${item.quantity}">Product</span>
                    <span th:text="${item.lineTotalFormatted}">520.000₫</span>
                </li>
            </ul>
            <dl class="success__totals">
                <div><dt>Tạm tính</dt><dd th:text="${order.subtotalFormatted()}">520.000₫</dd></div>
                <div><dt>Vận chuyển</dt><dd th:text="${order.shippingFormatted()}">Miễn phí</dd></div>
                <div class="success__total">
                    <dt>Tổng cộng</dt><dd th:text="${order.totalFormatted()}">550.000₫</dd>
                </div>
            </dl>
        </div>

        <a th:href="@{/}" class="btn btn--primary">TIẾP TỤC MUA SẮM</a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/cart-drawer :: drawer}"></div>

<script th:src="@{/js/main.js}" defer></script>
</body>
</html>
