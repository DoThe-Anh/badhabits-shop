<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đăng nhập — BAD HABITS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body class="page-auth">

<div th:replace="~{fragments/announcement-bar :: announcement}"></div>
<div th:replace="~{fragments/header :: header}"></div>

<main>
    <div class="auth">
        <div class="auth__card">
            <h1 class="auth__title">ĐĂNG NHẬP</h1>
            <p class="auth__sub">Chào mừng bạn quay lại Bad Habits Store.</p>

            <div th:if="${successMessage}" class="auth__alert auth__alert--success"
                 th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="auth__alert auth__alert--error"
                 th:text="${errorMessage}"></div>
            <div th:if="${warningMessage}" class="auth__alert auth__alert--warning"
                 th:text="${warningMessage}"></div>

            <form th:action="@{/login}" method="post" class="auth__form">
                <label class="auth__field">
                    <span>Email</span>
                    <input type="email" name="email" required autofocus
                           placeholder="you@example.com"/>
                </label>
                <label class="auth__field">
                    <span>Mật khẩu</span>
                    <input type="password" name="password" required minlength="6"
                           placeholder="••••••••"/>
                </label>

                <button type="submit" class="btn btn--primary btn--block">ĐĂNG NHẬP</button>
            </form>

            <p class="auth__foot">
                Chưa có tài khoản?
                <a th:href="@{/register}">Đăng ký ngay</a>
            </p>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/cart-drawer :: drawer}"></div>

<script th:src="@{/js/main.js}" defer></script>
</body>
</html>
