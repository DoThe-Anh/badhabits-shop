# Profile cho smoke test — dùng H2 in-memory, không cần MySQL/XAMPP/Docker.
# Hibernate tự sinh schema từ entity (create-drop).

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# Admin bootstrap — đặt sẵn password để DataInitializer seed admin trong test.
app.admin.email=admin@test.local
app.admin.password=test123

# Tắt 404 throw (smoke test không cần)
spring.mvc.throw-exception-if-no-handler-found=false
